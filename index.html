<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>냠냠 꼬마 요리사</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe9a8;font-family:"Jua","Cafe24 Ssurround","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;width:1000px;height:625px;transform-origin:center;overflow:hidden;border-radius:28px;background:#fff6d8;box-shadow:0 10px 40px rgba(160,110,20,.25)}
#stage,#stage *{touch-action:none}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
button{font-family:inherit;border:0;cursor:pointer;padding:0}

/* ---------- 공통 버튼 ---------- */
.round{position:absolute;width:76px;height:76px;border-radius:50%;font-size:38px;line-height:76px;text-align:center;background:#fff;box-shadow:0 6px 0 #e4b85a,0 10px 16px rgba(0,0,0,.12);z-index:30}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 #e4b85a}
#snd{right:16px;top:14px;width:64px;height:64px;line-height:64px;font-size:30px;z-index:60}
#back{left:16px;top:14px}

/* ---------- 타이틀 ---------- */
#title{background:radial-gradient(circle at 50% 40%,#fff9e0 0,#ffd97a 70%,#ffc35c 100%)}
#title h1{position:absolute;left:0;right:0;top:54px;margin:0;text-align:center;font-size:82px;color:#ff6b5e;text-shadow:0 5px 0 #fff,0 9px 0 rgba(200,90,40,.25);letter-spacing:2px}
#title h1 span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
#title .bunny{position:absolute;left:120px;top:210px;width:300px}
#title .foods{position:absolute;left:450px;top:230px;font-size:80px;width:480px;white-space:nowrap;text-align:center;line-height:1.25}
#title .foods i{display:inline-block;font-style:normal;animation:bob 1.8s ease-in-out infinite}
#playBtn{position:absolute;left:560px;top:420px;width:250px;height:120px;border-radius:60px;background:#5fd068;color:#fff;font-size:64px;box-shadow:0 10px 0 #36a546,0 18px 24px rgba(0,0,0,.18);animation:pulse 1.2s ease-in-out infinite}
#playBtn:active{transform:translateY(6px);box-shadow:0 4px 0 #36a546}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}

/* ---------- 메뉴 ---------- */
#menu{background:linear-gradient(#bdeaff 0,#bdeaff 46%,#ffe2a0 46%,#ffd27a 100%)}
#menu h2{position:absolute;left:0;right:0;top:26px;margin:0;text-align:center;font-size:46px;color:#3d7fb8;text-shadow:0 3px 0 #fff}
#cards{position:absolute;left:40px;right:40px;top:120px;display:flex;gap:22px;justify-content:center}
.card{position:relative;width:212px;height:300px;border-radius:36px;background:#fff;box-shadow:0 10px 0 #e9b95a,0 18px 24px rgba(0,0,0,.14);font-size:34px;color:#7a4b1e;animation:bob 2.2s ease-in-out infinite}
.card:nth-child(2){animation-delay:.3s}.card:nth-child(3){animation-delay:.6s}.card:nth-child(4){animation-delay:.9s}
.card:active{scale:.94}
.card .big{display:block;font-size:128px;line-height:1.25}
.card .made{position:absolute;left:0;right:0;bottom:16px;font-size:22px;color:#f0a020}
#menu .bunny{position:absolute;left:30px;top:450px;width:160px}
.bubble{position:absolute;background:#fff;border-radius:26px;padding:12px 22px;font-size:28px;color:#7a4b1e;box-shadow:0 5px 0 rgba(0,0,0,.08);white-space:nowrap}
#menu .bubble{left:200px;top:500px}

/* ---------- 플레이 ---------- */
#play{background:linear-gradient(#c9f0ff 0,#c9f0ff 40%,#ffe7b0 40%,#ffdc93 100%)}
#banner{position:absolute;left:110px;right:100px;top:14px;height:66px;border-radius:33px;background:#fff;font-size:34px;line-height:66px;text-align:center;color:#7a4b1e;box-shadow:0 5px 0 rgba(0,0,0,.08);z-index:20}
#dots{position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:5}
#dots i{display:inline-block;width:18px;height:18px;margin:0 6px;border-radius:50%;background:#fff;border:3px solid #e9b95a}
#dots i.on{background:#ff8f5e}#dots i.done{background:#5fd068;border-color:#36a546}
#area{position:absolute;inset:0}
#tray{position:absolute;right:14px;top:94px;width:216px;padding:10px;border-radius:30px;background:rgba(255,255,255,.75);display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:10;box-shadow:0 5px 0 rgba(0,0,0,.06)}
.tbtn{width:94px;height:92px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #e9d3a0;display:flex;align-items:center;justify-content:center}
.tbtn:active{scale:.92}
.tbtn.sel{outline:6px solid #ff8f5e;outline-offset:-3px}
#check{position:absolute;right:26px;top:510px;width:190px;height:92px;border-radius:46px;background:#5fd068;color:#fff;font-size:58px;line-height:92px;box-shadow:0 8px 0 #36a546,0 14px 18px rgba(0,0,0,.15);z-index:25;display:none}
#check.on{display:block;animation:pulse .9s ease-in-out infinite}
#check:active{transform:translateY(5px);box-shadow:0 3px 0 #36a546}
#play .bunny{position:absolute;left:8px;top:478px;width:128px;z-index:4}
.bunny.hop{animation:hop .45s}
@keyframes hop{0%,100%{translate:0 0}40%{translate:0 -22px}}

/* 재료 */
.art{display:block;overflow:visible}
.art *{stroke-linejoin:round;stroke-linecap:round}
.ing{display:block;pointer-events:none;line-height:0}
.ghost{position:absolute;z-index:50;transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 10px 6px rgba(0,0,0,.2))}
.ghost.fly{transition:left .36s cubic-bezier(.3,.8,.4,1),top .36s cubic-bezier(.3,.8,.4,1)}
.placed{position:absolute;line-height:0;transform:translate(-50%,-50%) rotate(var(--r,0deg));animation:pop .28s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.13))}
@keyframes pop{0%{scale:.2}70%{scale:1.25}100%{scale:1}}
.tag{position:absolute;z-index:65;transform:translate(-100%,-50%);background:#7a4b1e;color:#fff;font-size:30px;padding:8px 20px;border-radius:24px;white-space:nowrap;pointer-events:none;animation:tag 1.4s forwards}
@keyframes tag{0%{opacity:0;scale:.6}12%{opacity:1;scale:1.08}20%{scale:1}80%{opacity:1}100%{opacity:0}}

/* 요리 상자 */
.dish{position:absolute;width:400px;height:400px;margin:-200px 0 0 -200px}
.dish>svg.base{position:absolute;left:0;top:0}
.tops{position:absolute;inset:0;pointer-events:none}
.board{position:absolute;left:150px;top:120px;width:460px;height:460px;border-radius:50%;background:#e9bd7c;box-shadow:inset 0 0 0 12px #d9a65c,0 10px 0 rgba(0,0,0,.08)}

/* 피자 */
.board.plate{background:#fff;box-shadow:inset 0 0 0 12px #e3ebf4,0 10px 0 rgba(0,0,0,.08)}
.sauce{position:absolute;left:38px;top:38px;width:324px;height:324px;border-radius:50%}
.baked>svg.base{filter:saturate(1.3) brightness(.9)}
.baked .sauce{filter:brightness(.92) saturate(1.15)}
.baked .tops{filter:saturate(1.15) brightness(.96)}

/* 오븐/버튼/게이지 */
.oven{position:absolute;left:110px;top:150px;width:590px;height:410px;border-radius:44px;background:#ff9f68;box-shadow:inset 0 -14px 0 #ec7f48,0 12px 0 rgba(0,0,0,.08)}
.oven .win{position:absolute;left:70px;top:76px;width:450px;height:260px;border-radius:30px;background:#5a3a2e;border:12px solid #ffe3c4;overflow:hidden}
.oven .win:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 50px,rgba(255,255,255,.12) 50px 58px)}
.oven .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,#ffb13b,#ff5a1f 80%);opacity:0}
.oven .knob{position:absolute;top:24px;width:34px;height:34px;border-radius:50%;background:#ffe3c4}
.heat{position:absolute;left:150px;top:98px;width:500px;height:38px;border-radius:19px;background:#fff;border:5px solid #f3c56b;overflow:hidden}
.heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#ff7a2f);border-radius:14px}
.bigbtn{position:absolute;left:780px;top:250px;width:160px;height:160px;border-radius:50%;background:#ff6b5e;font-size:84px;line-height:160px;text-align:center;box-shadow:0 10px 0 #c9443a,0 18px 22px rgba(0,0,0,.18);animation:pulse .9s ease-in-out infinite}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #c9443a}
.bigbtn.run{animation:none;background:#ffb13b;box-shadow:0 10px 0 #d98a1b}
.steam{position:absolute;font-size:50px;animation:steam 1.2s ease-out forwards;pointer-events:none}
@keyframes steam{0%{opacity:0;translate:0 0}30%{opacity:.9}100%{opacity:0;translate:0 -90px}}

/* 프라이팬 */
.pan{position:absolute;left:230px;top:180px;width:350px;height:350px;border-radius:50%;background:#555e6b;border:18px solid #353c47;box-shadow:0 12px 0 rgba(0,0,0,.1)}
.pan:before{content:"";position:absolute;left:-200px;top:140px;width:200px;height:44px;border-radius:22px;background:#8a5a34}
.pan.oil{background:radial-gradient(circle,#ffd766 0,#f3bd3f 100%)}
.pan .raw{position:absolute;left:52px;top:52px;width:210px;height:210px;border-radius:48% 52% 50% 50%;border:8px solid rgba(0,0,0,.18);box-shadow:inset 14px 14px 0 rgba(255,255,255,.14)}
.pan .raw.flip{animation:flip .7s}
@keyframes flip{0%,100%{transform:none}50%{transform:translateY(-70px) scaleY(.05)}}

/* 쌓기 */
.bplate{position:absolute;left:20px;bottom:24px;width:360px;height:52px;border-radius:50%;background:#fff;box-shadow:inset 0 -8px 0 #dfe6ee,0 6px 0 rgba(0,0,0,.08)}
.stack{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center}
.stack>*{position:relative;line-height:0;animation:drop .3s}
@keyframes drop{0%{translate:0 -70px;opacity:0}70%{translate:0 4px}100%{translate:0 0}}

/* 컵케이크 */
.bowl{position:absolute;left:190px;top:160px;width:390px;height:390px;border-radius:50%;background:#7cc8f5;box-shadow:inset 0 0 0 10px #a8dcfb,0 12px 0 rgba(0,0,0,.08)}
.bowl .in{position:absolute;inset:38px;border-radius:50%;background:#fdfdfd;overflow:hidden;box-shadow:inset 0 10px 0 rgba(0,0,0,.06)}
.bowl .batter{position:absolute;inset:8px;border-radius:50%;opacity:0;background:conic-gradient(var(--b1),var(--b2),var(--b1),var(--b2),var(--b1))}
.spoon{position:absolute;font-size:110px;transform:translate(-30%,-80%);pointer-events:none;z-index:40}
.cwrap{position:absolute;left:105px;bottom:36px;width:190px;height:130px;clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);background:repeating-linear-gradient(90deg,#ff8fb1 0 16px,#ffc2d4 16px 32px)}
.ccake{position:absolute;left:88px;bottom:156px;width:224px;height:110px;border-radius:112px 112px 26px 26px/90px 90px 26px 26px;background:var(--batter,#f6dc9c);transform-origin:50% 100%;transform:scaleY(var(--rise,.3));box-shadow:inset 0 -10px 0 rgba(0,0,0,.08),inset 14px 10px 0 rgba(255,255,255,.18)}
.baked .ccake{filter:brightness(.9) saturate(1.2)}
.frost{position:absolute;left:70px;bottom:204px;display:none}
.frost.on{display:block;animation:pop .3s}

/* 주스 */
.jarLid{position:absolute;left:300px;top:128px;width:200px;height:30px;border-radius:14px 14px 4px 4px;background:#7b8ad6}
.jar{position:absolute;left:270px;top:156px;width:260px;height:290px;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:rgba(255,255,255,.7)}
.jar .liq{position:absolute;left:0;right:0;bottom:0;height:0}
.jar .fr{position:absolute;line-height:0;transform:translate(-50%,-50%);animation:drop .3s}
.jarBase{position:absolute;left:262px;top:440px;width:276px;height:96px;border-radius:26px 26px 34px 34px;background:#7b8ad6;box-shadow:inset 0 -12px 0 #5c6bbd}
.jarBase:after{content:"";position:absolute;left:113px;top:22px;width:50px;height:50px;border-radius:50%;background:#fff}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%,100%{translate:-4px 0;rotate:-1.5deg}50%{translate:4px 0;rotate:1.5deg}}
.spin{animation:spin .5s linear infinite}
@keyframes spin{to{rotate:360deg}}
.straw{position:absolute;left:226px;bottom:150px;width:22px;height:250px;border-radius:11px;background:repeating-linear-gradient(180deg,#ff6b5e 0 18px,#fff 18px 36px);transform:rotate(14deg);transform-origin:50% 100%}
.glass{position:absolute;left:90px;bottom:36px;width:220px;height:290px;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:rgba(255,255,255,.7)}
.glass .liq{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--juice,#ffb13b);transition:height 1.4s ease-out}
.glass .liq:before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:rgba(255,255,255,.45)}
.glass:after{content:"";position:absolute;left:40px;top:20px;width:16px;height:200px;border-radius:8px;background:rgba(255,255,255,.55)}

/* 아이스크림 */
.cone{position:absolute;left:125px;bottom:0}
.dish.ice .stack{bottom:185px}

/* 도넛 */
.glaze{position:absolute;left:0;top:0;width:400px;height:400px;-webkit-mask:radial-gradient(circle at 50% 50%,transparent 64px,#000 66px,#000 164px,transparent 166px);mask:radial-gradient(circle at 50% 50%,transparent 64px,#000 66px,#000 164px,transparent 166px)}

/* 김밥 */
.mat{position:absolute;left:150px;top:130px;width:460px;height:440px;border-radius:24px;background:repeating-linear-gradient(0deg,#a9d274 0 14px,#8fbf58 14px 18px);box-shadow:0 10px 0 rgba(0,0,0,.08)}
.sheet{position:absolute;left:20px;top:50px;width:360px;height:300px;transform-origin:50% 100%}
.sheet>svg{position:absolute;left:0;top:0}
.rice{position:absolute;left:15px;top:36px;width:330px;height:250px;border-radius:14px}
.rolls{position:absolute;inset:0;display:none}
.rolls.on{display:block}
.rolls .sl{position:absolute;line-height:0;transform:translate(-50%,-50%);animation:pop .4s both;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}

/* 미니 게임 */
.tag.up{transform:translate(-50%,-100%)}
.fix{position:absolute;line-height:0;pointer-events:none}
.mgstars{position:absolute;left:150px;top:90px;font-size:36px;z-index:6}
.mgstars i{font-style:normal;display:inline-block;margin-right:4px;filter:grayscale(1) opacity(.3)}
.mgstars i.on{filter:none;animation:pop .35s}
.cbtn{position:absolute;width:132px;height:132px;border-radius:36px;background:#fff;box-shadow:0 7px 0 #e9d3a0;display:flex;align-items:center;justify-content:center;line-height:0}
.cbtn svg{pointer-events:none}
.cbtn:active{scale:.94}
.cbtn.bare{background:none;box-shadow:none}
.cbtn.no{animation:no .4s}
@keyframes no{25%{translate:-10px 0}50%{translate:10px 0}75%{translate:-6px 0}}
.cbtn.glow{animation:pulse .7s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffc400) drop-shadow(0 0 4px #ffc400)}
.sil{position:absolute;line-height:0;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff);animation:pulse 1.2s ease-in-out infinite}
.sil svg{filter:brightness(0) opacity(.5)}
.sil.show{animation:pop .35s}
.sil.show svg{filter:none}
.peek{position:absolute;display:flex;line-height:0;width:240px;justify-content:center}
.peek>*{margin:0 -8px;animation:pop .3s}
.awning{position:absolute;left:412px;top:92px;width:576px;height:66px;border-radius:14px 14px 30px 30px;background:repeating-linear-gradient(90deg,#ff8f5e 0 48px,#fff3d0 48px 96px);box-shadow:0 6px 0 rgba(0,0,0,.14);z-index:3}
.shelf{position:absolute;left:430px;top:146px;width:540px;height:446px;border:12px solid #a8743f;border-radius:12px;background:linear-gradient(#a8743f,#a8743f) 0 50%/100% 12px no-repeat,repeating-linear-gradient(90deg,#74512f 0 84px,#6b4a2b 84px 88px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;place-items:center;padding-top:14px}
.shelf .cbtn{position:static}
.note{position:absolute;width:180px;height:180px;border-radius:28px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;rotate:-4deg;line-height:0}
.note:before{content:"📌";position:absolute;top:-22px;left:74px;font-size:34px;line-height:1}
.note.pop{animation:pop .35s}
.trayBig{position:absolute;left:150px;top:96px;width:820px;height:310px;border-radius:50px;background:#fff;box-shadow:inset 0 0 0 12px #dfeaf5,0 8px 0 rgba(0,0,0,.08)}
.mplate{position:absolute;width:190px;height:190px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 12px #dfeaf5,0 8px 0 rgba(0,0,0,.08)}
.mplate>*{position:absolute;line-height:0;transform:translate(-50%,-50%);animation:pop .3s}
.mplate .want{opacity:.25;animation:none}
.cboard{position:absolute;width:440px;height:400px;border-radius:40px;background:#e9bd7c;box-shadow:inset 0 0 0 12px #d9a65c,0 10px 0 rgba(0,0,0,.08)}
.cboard .it{position:absolute;left:110px;top:90px;line-height:0;pointer-events:none}
.cboard .it svg{transition:clip-path .12s}
.knife{position:absolute;left:290px;top:10px;font-size:120px;line-height:1;pointer-events:none}
.knife.cut{animation:cut .22s}
@keyframes cut{50%{transform:translate(-40px,110px) rotate(-30deg)}}

/* 메뉴 8종 배치 */
#menu h2{top:16px;font-size:40px}
#cards{top:76px;flex-wrap:wrap;gap:16px 20px}
.card{width:205px;height:214px;font-size:28px;border-radius:32px}
.card .big{height:140px;display:flex;align-items:center;justify-content:center;font-size:0;line-height:0}
.card .made{left:auto;bottom:auto;right:14px;top:10px;font-size:18px}
#menu .bunny{left:36px;top:526px;width:92px}
#menu .bubble{left:140px;top:548px;font-size:24px;padding:8px 18px}
#title .foods{line-height:0;display:flex;gap:14px;justify-content:center;top:236px}

/* 연출 */
#hand{position:absolute;left:0;top:0;font-size:72px;z-index:70;pointer-events:none;display:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#praise{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(255,255,255,.35)}
#praise.on{display:flex}
#praise b{font-size:150px;color:#ff6b5e;text-shadow:0 8px 0 #fff,0 14px 0 rgba(200,90,40,.25);animation:praise 1.3s both}
@keyframes praise{0%{scale:.1;rotate:-14deg}35%{scale:1.2;rotate:5deg}55%{scale:1;rotate:0}85%{scale:1;opacity:1}100%{scale:1.3;opacity:0}}
.fx{position:absolute;z-index:75;pointer-events:none;font-size:34px;animation:fx .6s ease-out forwards}
@keyframes fx{0%{opacity:1;translate:0 0;scale:.5}100%{opacity:0;translate:var(--dx) var(--dy);scale:1.3}}
.conf{position:absolute;top:-30px;width:16px;height:26px;border-radius:5px;z-index:78;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{translate:var(--dx) 700px;rotate:var(--rot)}}

/* 완성 */
#finish{background:radial-gradient(circle at 50% 55%,#fffbe6 0,#ffe08a 60%,#ffc35c 100%)}
#rays{position:absolute;left:50%;top:350px;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 12deg,transparent 12deg 30deg);animation:spin 18s linear infinite}
#stars{position:absolute;left:0;right:0;top:20px;text-align:center;height:130px}
#stars i{display:inline-block;font-style:normal;font-size:104px;margin:0 16px;scale:0;filter:drop-shadow(0 6px 0 rgba(200,120,0,.3))}
#stars i:nth-child(2){translate:0 -18px}
#stars i.on{animation:star .5s forwards}
@keyframes star{0%{scale:0;rotate:-90deg}70%{scale:1.3}100%{scale:1;rotate:0}}
#plate{position:absolute;left:290px;top:150px;width:420px;height:420px}
#plate .dish{transition:transform .35s}
#finish .bunny{position:absolute;left:24px;top:360px;width:220px}
#finish .bubble{left:40px;top:296px}
#again,#home{top:480px;width:104px;height:104px;line-height:104px;font-size:54px;display:none}
#again{right:150px;background:#5fd068;box-shadow:0 8px 0 #36a546}
#home{right:30px}
#finish.btns #again,#finish.btns #home{display:block}

/* ---------- 마을 · 손님 · 놀이터 ---------- */
.goback{left:16px;top:14px}
#town{background:linear-gradient(#bdeaff 0,#dff5ff 58%,#a9dd7c 58%,#8fcf63 100%)}

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (cls, html) => { const d = document.createElement('div'); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
const rnd = (a, b) => a + Math.random() * (b - a);
const stage = $('#stage');
let S = 1;

function fit() {
  S = Math.min(innerWidth / 1000, innerHeight / 625);
  stage.style.transform = `translate(-50%,-50%) scale(${S})`;
}
addEventListener('resize', fit); fit();
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

function toStage(cx, cy) { const r = stage.getBoundingClientRect(); return { x: (cx - r.left) / S, y: (cy - r.top) / S }; }
function local(node, cx, cy) { const r = node.getBoundingClientRect(); return { x: (cx - r.left) * node.offsetWidth / r.width, y: (cy - r.top) * node.offsetHeight / r.height }; }
function center(node) { const r = node.getBoundingClientRect(); return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; }

/* ================= 소리 (Web Audio 합성) ================= */
const snd = (() => {
  let ac, master, sfxG, musG, noiseBuf, vsrc, muted = false, timer, nextT = 0, idx = 0;
  const MEL = [
    [76,79,76,72,76,79,84,0],[81,77,81,84,81,77,81,0],[83,79,83,86,83,79,74,0],[76,72,76,79,84,0,79,0],
    [84,81,84,88,84,81,76,0],[81,84,81,77,81,84,77,0],[86,83,79,83,86,79,83,86],[84,0,79,0,84,0,0,0]];
  const BASS = [48,53,55,48,45,53,55,48];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = .9; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = .5; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ac.currentTime + .1;
    timer = setInterval(sched, 90);
  }
  function tone(f1, f2, dur, type = 'sine', vol = .25, delay = 0, dest) {
    if (!ac) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, freq, vol = .2, delay = 0, q = 1) {
    if (!ac) return;
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxG); s.start(t); s.stop(t + dur + .02);
  }
  function sched() {
    if (!ac || ac.state !== 'running') return;
    if (nextT < ac.currentTime) nextT = ac.currentTime + .05;
    const e8 = 60 / 124 / 2;
    while (nextT < ac.currentTime + .3) {
      const bar = Math.floor(idx / 8) % 8, s = idx % 8, m = MEL[bar][s], d = nextT - ac.currentTime;
      if (m) tone(hz(m), hz(m), e8 * 1.6, 'sine', .11, d, musG);
      if (s % 2 === 0) tone(hz(BASS[bar] + (s % 4 ? 7 : 0)), hz(BASS[bar] + (s % 4 ? 7 : 0)), e8 * 1.3, 'triangle', .16, d, musG);
      if (s % 2 === 1) tone(hz(BASS[bar] + 24), hz(BASS[bar] + 24), e8 * .5, 'triangle', .035, d, musG);
      nextT += e8; idx++;
    }
  }
  function loop(kind) { // 지글지글 / 윙윙 지속음. 정지 함수를 돌려준다
    if (!ac) return () => {};
    const g = ac.createGain(); g.gain.value = 0; g.connect(sfxG);
    g.gain.linearRampToValueAtTime(kind === 'blend' ? .12 : .16, ac.currentTime + .2);
    let src;
    if (kind === 'blend') {
      src = ac.createOscillator(); src.type = 'sawtooth'; src.frequency.value = 150;
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 9; lg.gain.value = 30; l.connect(lg); lg.connect(src.frequency); l.start();
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; src.connect(f); f.connect(g);
    } else {
      src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3500; src.connect(f); f.connect(g);
    }
    src.start();
    return () => { try { g.gain.linearRampToValueAtTime(0, ac.currentTime + .2); src.stop(ac.currentTime + .25); } catch (e) {} };
  }
  const arp = (notes, step, dur, vol = .22, type = 'triangle') => notes.forEach((n, i) => tone(hz(n), hz(n), dur, type, vol, i * step));
  return {
    init, loop,
    get on() { return !!ac; },
    decode: ab => new Promise((ok, no) => ac.decodeAudioData(ab, ok, no)),
    voice(buf) { if (!ac) return; try { vsrc && vsrc.stop(); } catch (e) {} vsrc = ac.createBufferSource(); vsrc.buffer = buf; vsrc.connect(master); vsrc.start(); },
    get muted() { return muted; },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; if (muted && window.speechSynthesis) speechSynthesis.cancel(); if (muted) try { vsrc && vsrc.stop(); } catch (e) {} return muted; },
    pause(p) { if (ac) p ? ac.suspend() : ac.resume(); },
    click() { tone(700, 900, .07, 'sine', .25); },
    pick() { tone(420, 880, .09, 'sine', .28); },
    plop() { tone(660, 220, .13, 'sine', .32); tone(990, 1320, .06, 'sine', .12, .1); },
    whoosh() { noise(.25, 1200, .18); },
    squish() { noise(.09, rnd(500, 900), .22, 0, 3); tone(rnd(240, 320), 180, .08, 'sine', .1); },
    bubble() { tone(rnd(300, 500), rnd(700, 1000), .1, 'sine', .16); },
    ready() { arp([79, 84], .09, .18); },
    ding() { tone(1568, 1568, 1.1, 'sine', .3); tone(2093, 2093, 1.3, 'sine', .22, .12); },
    good() { arp([72, 76, 79, 84, 88], .08, .28, .24); arp([60, 67], .16, .4, .14, 'sine'); },
    star(i) { tone(hz(84 + i * 4), hz(84 + i * 4), .5, 'sine', .3); tone(hz(96 + i * 4), hz(96 + i * 4), .35, 'sine', .12, .05); },
    fanfare() { arp([72, 72, 72, 76, 79, 84], .13, .3, .26, 'square'); arp([84, 88, 91, 96], .09, .5, .2, 'triangle'); },
    nom() { tone(260, 150, .1, 'square', .16); tone(220, 130, .1, 'square', .16, .14); },
    wrong() { tone(330, 220, .16, 'sine', .18); },
    chop() { noise(.06, 2200, .3, 0, 2); tone(180, 90, .08, 'square', .14); },
    pop() { noise(.07, 1800, .4, 0, 1); tone(520, 110, .1, 'square', .14); },
    pour() { for (let i = 0; i < 10; i++) tone(rnd(400, 700), rnd(800, 1200), .09, 'sine', .12, i * .12); },
  };
})();

// 녹음된 목소리(voice/*.mp3)가 준비돼 있으면 그것으로, 없으면 기기 내장 음성으로 말한다
const VO = { map: {}, buf: {}, bad: {}, tok: 0, on: !!window.VOICE_READY };
(window.VOICE_LINES || []).forEach(l => VO.map[l[2]] = l[0]);
function loadVoice(id) {
  return VO.buf[id] || (VO.buf[id] = fetch(`voice/${id}.mp3`).then(res => { if (!res.ok) throw 0; return res.arrayBuffer(); }).then(ab => snd.decode(ab)).catch(() => { VO.bad[id] = 1; return null; }));
}
function tts(text) {
  if (!window.speechSynthesis) return;
  try {
    const ko = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ko'));
    // 기기에 여러 음성이 있으면 자연스러운 쪽을 먼저 고른다
    const v = ['Natural', 'Yuna', '유나', 'Google', 'SunHi', 'Heami'].map(n => ko.find(v => v.name.includes(n))).find(Boolean) || ko[0];
    if (!v) return; // 한국어 음성이 없으면 효과음만
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = 'ko-KR'; u.pitch = 1.1; u.rate = .95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text) {
  if (snd.muted) return;
  const id = VO.on && VO.map[text], tok = ++VO.tok;
  if (!id || VO.bad[id] || !snd.on) return tts(text);
  loadVoice(id).then(b => { if (tok !== VO.tok || snd.muted) return; if (!b) return tts(text); if (window.speechSynthesis) speechSynthesis.cancel(); snd.voice(b); });
}
if (window.speechSynthesis) speechSynthesis.getVoices();

document.addEventListener('pointerdown', () => { snd.init(); if (VO.on && !VO.pre) { VO.pre = 1; Object.values(VO.map).forEach(loadVoice); } }, true);
document.addEventListener('visibilitychange', () => snd.pause(document.hidden));
$('#snd').addEventListener('click', () => { $('#snd').textContent = snd.toggle() ? '🔇' : '🔊'; });

/* ================= 캐릭터 (토끼 요리사 "토리") ================= */
const BUNNY = `<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="52" cy="62" rx="20" ry="50" fill="#fff" stroke="#e7d6c8" stroke-width="4" transform="rotate(-22 52 62)"/>
<ellipse cx="52" cy="66" rx="9" ry="34" fill="#ffc2d4" transform="rotate(-22 52 66)"/>
<ellipse cx="148" cy="62" rx="20" ry="50" fill="#fff" stroke="#e7d6c8" stroke-width="4" transform="rotate(22 148 62)"/>
<ellipse cx="148" cy="66" rx="9" ry="34" fill="#ffc2d4" transform="rotate(22 148 66)"/>
<ellipse cx="100" cy="140" rx="74" ry="64" fill="#fff" stroke="#e7d6c8" stroke-width="4"/>
<g stroke="#d8dfe8" stroke-width="4" fill="#fff"><circle cx="76" cy="56" r="22"/><circle cx="124" cy="56" r="22"/><circle cx="100" cy="44" r="26"/><rect x="68" y="62" width="64" height="26" rx="8"/></g>

function sparkle(cx, cy, chars = ['✨', '⭐', '💛']) {
  const p = toStage(cx, cy);
  for (let i = 0; i < 5; i++) {
    const f = el('fx', chars[i % chars.length]);
    f.style.left = p.x - 17 + 'px'; f.style.top = p.y - 17 + 'px';
    f.style.setProperty('--dx', rnd(-70, 70) + 'px'); f.style.setProperty('--dy', rnd(-80, 20) + 'px');
    stage.appendChild(f); setTimeout(() => f.remove(), 650);
  }
}

    const c = el('conf');

    c.style.setProperty('--dx', rnd(-120, 120) + 'px'); c.style.setProperty('--rot', rnd(-720, 720) + 'deg');

}

const hint = (() => {
  const hand = $('#hand'); let anim, last, idle;
  function stop() { if (anim) anim.cancel(); anim = null; hand.style.display = 'none'; clearTimeout(idle); if (last) idle = setTimeout(() => last && last(), 7000); }
  function run(frames, dur) { if (anim) anim.cancel(); hand.style.display = 'block'; anim = hand.animate(frames, { duration: dur, iterations: Infinity, easing: 'ease-in-out' }); }
  const pt = n => { const c = center(n), p = toStage(c.cx, c.cy); return `translate(${p.x - 30}px,${p.y - 8}px)`; };
  function set(fn) { last = fn; clearTimeout(idle); requestAnimationFrame(() => last === fn && fn()); }
  return {
    stop, clear() { last = null; stop(); clearTimeout(idle); },
    drag(a, b) { set(() => run([{ transform: pt(a), opacity: 0 }, { transform: pt(a), opacity: 1, offset: .15 }, { transform: pt(b), opacity: 1, offset: .8 }, { transform: pt(b), opacity: 0 }], 1800)); },
    rub(a) { set(() => { const c = center(a), p = toStage(c.cx, c.cy), t = (dx, dy) => `translate(${p.x - 30 + dx}px,${p.y - 8 + dy}px)`; run([{ transform: t(-80, -30) }, { transform: t(70, -50) }, { transform: t(80, 40) }, { transform: t(-60, 60) }, { transform: t(-80, -30) }], 2000); }); },
    tap(a) { set(() => { const c = center(a), p = toStage(c.cx, c.cy), t = (d, s) => `translate(${p.x - 30}px,${p.y + d}px) scale(${s})`; run([{ transform: t(30, 1) }, { transform: t(0, .85) }, { transform: t(30, 1) }], 900); }); },
  };
})();
$('#play').addEventListener('pointerdown', () => hint.stop(), true);

function dragItem(src, node, o, ev0, isNew) {
  ev0.preventDefault();
  const sx = ev0.clientX, sy = ev0.clientY, q0 = toStage(sx, sy), ox = isNew ? 0 : o.x - q0.x, oy = isNew ? 0 : o.y - q0.y; let moved = false;

    box.appendChild(b);
  });
  show('guests'); say('누구에게 요리해 줄까요?');
}
$('#book').addEventListener('click', () => { snd.click(); goMenu(); });

function buildMenu() {
  const box = $('#cards'); box.innerHTML = '';
  Object.entries(RECIPES).forEach(([key, r]) => {
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<span class="big">${svgHTML(r.card, 124)}</span>${r.name}<span class="made">${made[key] ? '⭐ × ' + made[key] : ''}</span>`;
    b.addEventListener('click', () => { snd.click(); say(r.name); const pool = friendPool(); start(key, pool[Math.floor(Math.random() * pool.length)]); });
    box.appendChild(b);
  });
}
function goMenu() { teardown(); run = null; buildMenu(); show('menu'); }
function goPark() {
  teardown(); run = null;
  const box = $('#pcards'); box.innerHTML = '';
  GAMES.forEach(g => {
    const b = mkBtn('card', `<span class="big">${g.icon()}</span>${g.name}`);
    b.addEventListener('click', () => { snd.click(); run = { game: g, i: 0, state: {}, dish: el(''), steps: [{ text: g.text, say: g.say, noTray: true, setup: g.setup }] }; show('play'); step(); });
    box.appendChild(b);
  });
  show('park'); say('무슨 놀이를 할까요?');
}
function teardown() {
  if (ctx) ctx.alive = false; ctx = null; busy = false;
  hint.clear(); stage.querySelectorAll('.ghost,.tag').forEach(g => g.remove());
  $('#check').classList.remove('on');
}
function start(key, friend) {
  const R = RECIPES[key];
  run = { key, R, friend, i: 0, state: {}, dish: R.makeDish(), steps: [miniStep(key)].concat(R.steps) };
  show('play'); step();
}
function step() {
  teardown();
  const { steps, i } = run;
  if (i >= steps.length) return finish();
  const st = steps[i];
  $('#banner').textContent = st.text;
  $('#dots').innerHTML = steps.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'on' : ''}"></i>`).join('') + '<i></i>';
  const area = $('#area'), tray = $('#tray'); area.innerHTML = ''; tray.innerHTML = ''; tray.style.display = st.noTray ? 'none' : '';
  run.dish.style.top = '';
  ctx = { alive: true, area, tray, dish: run.dish, state: run.state, shown: false,
    ready() { if (this.shown || !this.alive) return; this.shown = true; $('#check').classList.add('on'); snd.ready(); },
    finish() { if (this.alive) complete(); } };
  st.setup(ctx);
  setTimeout(() => ctx && ctx.alive && say(st.say), 250);
}
function complete() {
  if (busy || !ctx) return; busy = true;
  const st = run.steps[run.i]; hint.clear(); $('#check').classList.remove('on');
  st.onCheck && st.onCheck(ctx);
  setTimeout(praise, st.onCheck ? 450 : 0);
  const mine = ctx;
  setTimeout(() => { if (mine.alive) { run.i++; step(); } }, st.onCheck ? 1900 : 1450);
}
$('#check').addEventListener('click', complete);
$('#back').addEventListener('click', () => { snd.click(); run && run.game ? goPark() : goGuests(); });

// 완성 → 친구에게 가져다주기 → 친구가 먹고 기뻐함 → 선물 상자
function finish() {
  teardown();
  const mine = run, k = run.friend, dish = run.dish, fin = $('#finish'), plate = $('#plate'), fr = $('#friend'), bub = $('#fbub');
  show('finish'); fin.classList.remove('btns'); fr.className = ''; plate.className = ''; plate.innerHTML = ''; plate.onpointerdown = null;
  $('#gift').className = ''; $('#prize').innerHTML = '';
  const alive = () => run === mine && fin.classList.contains('on'), later = (fn, ms) => setTimeout(() => alive() && fn(), ms);
  const stars = [...document.querySelectorAll('#stars i')]; stars.forEach(s => s.classList.remove('on'));
  snd.fanfare(); confetti();
  stars.forEach((s, i) => later(() => { s.classList.add('on'); snd.star(i); }, 700 + i * 420));
  if (run.game) { fr.innerHTML = BUNNY; bub.textContent = '참 잘했어요!'; later(() => giftScene(alive), 2300); return; }
  made[run.key] = (made[run.key] || 0) + 1; try { localStorage.setItem('littleChefMade', JSON.stringify(made)); } catch (e) {}
  fr.innerHTML = animal(k, '', 280); mount(plate, dish, 210, 210, .9);
  bub.textContent = '완성! 정말 맛있겠다!'; later(() => say('완성! 정말 맛있겠다!'), 500);
  let ok = false, fed = false;
  later(() => { ok = true; bub.textContent = `${FR[k].n}에게 가져다줘요`; say('친구에게 음식을 가져다줘요'); hint.drag(plate, fr); }, 3000);
  plate.onpointerdown = () => {
    if (!ok || fed) return; fed = true; hint.clear(); snd.whoosh();
    plate.classList.add('go'); dish.style.transform = 'scale(.45)';
    [0, 1, 2].forEach(i => later(() => {
      fr.innerHTML = animal(k, 'open', 280); snd.nom(); dish.style.transform = `scale(${[.3, .16, 0][i]})`;
      const q = center(fr); sparkle(q.cx + 60 * S, q.cy, ['냠', '😋', '💕']);
      later(() => fr.innerHTML = animal(k, i === 2 ? 'joy' : '', 280), 280);
    }, 800 + i * 600));
    later(() => {
      fr.classList.add('joy'); snd.good(); say('냠냠! 정말 맛있어요! 고마워요!'); bub.textContent = '냠냠! 맛있어요! 고마워요!';
      const q = center(fr); sparkle(q.cx, q.cy - 80 * S, ['❤️', '💕', '💛']);
      save.served[k] = (save.served[k] || 0) + 1; store();
    }, 2700);
    later(() => giftScene(alive), 5600);
  };
}
function giftScene(alive) {
  const g = $('#gift'), id = giveGift(), d = DECO[id], bub = $('#fbub'); let taps = 0;
  $('#plate').innerHTML = ''; g.innerHTML = svgHTML('giftbox', 220); g.className = 'on';
  bub.textContent = '선물 상자를 톡톡 눌러요'; say('선물 상자를 톡톡 눌러요'); snd.ready(); hint.tap(g);
  g.onpointerdown = ev => {
    if (!alive() || taps >= 3) return;
    taps++; snd.pick(); sparkle(ev.clientX, ev.clientY); g.className = 'on'; void g.offsetWidth; g.className = 'on shake';
    if (taps < 3) return;
    hint.clear();
    setTimeout(() => {
      if (!alive()) return;
      g.className = ''; snd.fanfare(); confetti();
      const pz = $('#prize'); pz.innerHTML = `<button class="pitem">${svgHTML(id, fitW(id, 190))}</button><b>${d.n}</b>`;
      pz.firstChild.onclick = () => { snd.pick(); say(d.n); };
      bub.textContent = '와! 선물을 받았어요!'; say('와! 선물을 받았어요!');
      setTimeout(() => { if (alive()) { say(d.n); $('#finish').classList.add('btns'); } }, 2300);
    }, 450);
  };
}
$('#toHouse').addEventListener('click', () => { snd.click(); goHouse(); });
$('#again').addEventListener('click', () => { snd.click(); run && run.game ? goPark() : goGuests(); });
$('#home').addEventListener('click', () => { snd.click(); goTown(); });
$('#playBtn').addEventListener('click', () => { snd.init(); snd.good(); say('안녕! 같이 요리하자!'); goTown(true); });
</script>
